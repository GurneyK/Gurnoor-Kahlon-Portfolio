<!-- Mode B: concatenated src/ files, each top-level file wrapped in its own
     IIFE (see 02-components.jsx etc.) so top-level consts don't collide. -->
<script type="text/babel" data-presets="react">
// ──────── 00-utils.jsx ────────
// Animation primitives — Stage, Sprite, Layer, useTime, useSprite, easing, interpolate, helpers.
//
// Drop this in as the FIRST <script type="text/babel"> block (Mode A) or as
// src/01-utils.jsx + src/05-primitives.jsx in Mode B (split per concern).
//
// Everything attached to `window` so cross-block usage works (see references/react-babel-traps.md).

const { useState, useRef, useEffect, useContext, createContext, useMemo } = React;

// ── Easing ────────────────────────────────────────────────────────────────────

const Easing = {
  linear:    p => p,
  in:        p => p * p,
  out:       p => 1 - (1 - p) * (1 - p),
  inOut:     p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2,
  inCubic:   p => p ** 3,
  outCubic:  p => 1 - Math.pow(1 - p, 3),
  inOutCubic:p => p < 0.5 ? 4 * p ** 3 : 1 - Math.pow(-2 * p + 2, 3) / 2,
  outQuart:  p => 1 - Math.pow(1 - p, 4),
  outBack:   p => { const c1 = 1.70158, c3 = c1 + 1;
                    return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  smooth:    p => p * p * p * (p * (6 * p - 15) + 10),  // smootherstep — DEFAULT
};

// ── Math helpers ──────────────────────────────────────────────────────────────

const clamp01 = p => Math.max(0, Math.min(1, p));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const smoothstep = (a, b, t) => { const x = clamp01((t - a) / (b - a)); return x * x * (3 - 2 * x); };

function twLerp(a, b, p) {
  if (Array.isArray(a) && Array.isArray(b) && a.length === b.length) {
    return a.map((v, i) => v + (b[i] - v) * p);
  }
  return a + (b - a) * p;
}

function interpolate(t, [i0, i1], [o0, o1], easing = Easing.linear) {
  if (t <= i0) return o0;
  if (t >= i1) return o1;
  const p = easing((t - i0) / (i1 - i0));
  if (Array.isArray(o0)) return twLerp(o0, o1, p);
  return o0 + (o1 - o0) * p;
}

// keyframe sequence — stops = [[t, v, easing?], …]; per-stop easing wins over default.
function seq(now, stops, easing = Easing.smooth) {
  if (now <= stops[0][0]) return stops[0][1];
  if (now >= stops.at(-1)[0]) return stops.at(-1)[1];
  for (let i = 0; i < stops.length - 1; i++) {
    const [t0, v0, e] = stops[i];
    const [t1, v1] = stops[i + 1];
    if (now >= t0 && now < t1) {
      const p = (now - t0) / (t1 - t0);
      return twLerp(v0, v1, (e || easing)(p));
    }
  }
  return stops.at(-1)[1];
}

// step-hold — returns latest stop whose t <= now. No interpolation.
function hold(now, stops) {
  let v = stops[0][1];
  for (const [t, val] of stops) if (now >= t) v = val; else break;
  return v;
}

// envelope — fade in [t0,t1], hold [t1,t2], fade out [t2,t3]. Pass Infinity to skip a side.
function envS(now, t0, t1, t2, t3) {
  if (now <= t0) return 0;
  if (now >= t3) return 0;
  if (now < t1)  return Easing.smooth(clamp01((now - t0) / (t1 - t0)));
  if (now < t2)  return 1;
  return Easing.smooth(1 - clamp01((now - t2) / (t3 - t2)));
}

// ── Stage / Sprite / Layer ────────────────────────────────────────────────────

const StageCtx  = createContext({ t: 0, duration: 1 });
const SpriteCtx = createContext({ start: 0, end: 0, p: 0 });
const useTime   = () => useContext(StageCtx).t;
const useSprite = () => useContext(SpriteCtx).p;

function Stage({ duration, width = 1280, height = 720, loop = false, children, onFinish }) {
  const [t, setT] = useState(0);
  const [paused, setPaused] = useState(false);
  const [scale, setScale] = useState(1);
  const tRef = useRef(0);
  const lastRef = useRef(performance.now());
  const playingRef = useRef(true);

  useEffect(() => {
    let raf;
    const tick = (now) => {
      const dt = Math.min((now - lastRef.current) / 1000, 0.05);
      lastRef.current = now;
      if (playingRef.current) {
        const next = tRef.current + dt;
        if (next >= duration) {
          if (loop) { tRef.current = 0; setT(0); }
          else {
            tRef.current = duration; setT(duration);
            if (onFinish) onFinish();
            window.parent?.postMessage({ type: 'finished' }, '*');
            return;
          }
        } else { tRef.current = next; setT(next); }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [duration, loop, onFinish]);

  useEffect(() => {
    const onResize = () => setScale(Math.min(window.innerWidth / width, window.innerHeight / height));
    onResize();
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, [width, height]);

  const seek    = (v) => { tRef.current = clamp(v, 0, duration); setT(tRef.current); };
  const toggle  = () => { playingRef.current = !playingRef.current; setPaused(!playingRef.current); };
  const restart = () => { tRef.current = 0; setT(0); lastRef.current = performance.now();
                          playingRef.current = true; setPaused(false); };
  const toggleFullscreen = () => {
    if (typeof document === 'undefined') return;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }
  };

  // Keybindings: Space (toggle), R (restart), F (fullscreen)
  useEffect(() => {
    if (typeof window === 'undefined') return;
    const onKey = (e) => {
      if (e.code === 'Space') { e.preventDefault(); toggle(); }
      else if (e.code === 'KeyR') { restart(); }
      else if (e.code === 'KeyF') { toggleFullscreen(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const embed = typeof location !== 'undefined' &&
                new URLSearchParams(location.search).get('embed') === '1';

  // Deterministic-capture hook — works even in ?embed=1 (no visible controls).
  // In embed mode only, pause live playback so headless frame capture fully
  // controls time without the rAF loop racing ahead between seek and screenshot.
  useEffect(() => {
    if (embed) { playingRef.current = false; setPaused(true); }
    window.__seekTo = seek;
    return () => { delete window.__seekTo; };
  }, []);

  return (
    React.createElement(React.Fragment, null,
      React.createElement('div', {
        className: 'stage',
        style: { width, height, position: 'relative', transform: `scale(${scale})`,
                 transformOrigin: 'center', willChange: 'transform' },
      },
        React.createElement(StageCtx.Provider, { value: { t, duration } }, children)
      ),
      !embed && React.createElement('div', {
        className: 'controls',
        style: {
          position: 'fixed', bottom: 16, left: '50%', transform: 'translateX(-50%)',
          display: 'flex', gap: 10, alignItems: 'center', padding: '8px 12px',
          background: 'rgba(0,0,0,0.6)', backdropFilter: 'blur(8px)',
          borderRadius: 999, color: '#fff', fontSize: 12, zIndex: 100,
          fontFamily: '-apple-system, sans-serif',
        },
      },
        React.createElement('button', { onClick: toggle, style: btnStyle, title: 'Play / Pause (Space)' }, paused ? '▶' : '❙❙'),
        React.createElement('button', { onClick: restart, style: btnStyle, title: 'Restart (R)' }, '↺'),
        React.createElement('input', {
          type: 'range', min: 0, max: duration, step: 0.01, value: t,
          style: { width: 240, accentColor: '#fff' },
          onChange: e => seek(+e.target.value),
        }),
        React.createElement('span', null, `${t.toFixed(2)} / ${duration.toFixed(2)}s`),
        React.createElement('button', { onClick: toggleFullscreen, style: btnStyle, title: 'Fullscreen (F)' }, '⛶')
      )
    )
  );
}

const btnStyle = {
  background: 'transparent', border: '1px solid rgba(255,255,255,0.2)', color: '#fff',
  padding: '4px 10px', borderRadius: 999, cursor: 'pointer', fontSize: 12,
};

function Sprite({ start, end, children }) {
  const { t } = useContext(StageCtx);
  if (t < start || t > end) return null;
  const p = clamp01((t - start) / (end - start));
  return React.createElement(SpriteCtx.Provider, { value: { start, end, p } }, children);
}

function Layer({ x = 0, y = 0, w, h, scale: s = 1, rotation = 0, opacity = 1, style, children }) {
  return React.createElement('div', {
    style: {
      position: 'absolute', left: x, top: y, width: w, height: h, opacity,
      transform: `scale(${s}) rotate(${rotation}deg)`, transformOrigin: 'center', ...style,
    },
  }, children);
}

// ── Tweak registry ────────────────────────────────────────────────────────────

function createTweakCtx(tweaks = {}) {
  const manifest = [];
  const reg = (key, fallback, type, meta = {}) => {
    const v = tweaks[key] ?? fallback;
    manifest.push({ key, value: v, type, ...meta });
    return v;
  };
  return {
    num:   (k, f, m) => reg(k, f, 'num', m),
    bool:  (k, f, m) => reg(k, f, 'bool', m),
    text:  (k, f, m) => reg(k, f, 'text', m),
    point: (k, f, m) => reg(k, f, 'point', m),
    el:    (id, label) => manifest.push({ key: `_el_${id}`, value: null, type: 'el', label }),
    manifest,
  };
}

// ── Edge-trigger fire registry (for SFX) ──────────────────────────────────────

function makeFireFn(tRefGetter) {
  const fired = new Set();
  let lastT = 0;
  return function fire(threshold, key, fn) {
    const now = tRefGetter();
    if (now < lastT - 0.05 && fired.has(key)) fired.delete(key);   // re-arm on scrub-back
    if (lastT <= threshold && now > threshold && !fired.has(key)) {
      fired.add(key);
      try { fn(); } catch (_) {}
    }
    lastT = now;
  };
}

// ── Export ────────────────────────────────────────────────────────────────────

Object.assign(window, {
  Stage, Sprite, Layer, useTime, useSprite,
  Easing, clamp01, clamp, smoothstep, twLerp, interpolate, seq, hold, envS,
  createTweakCtx, makeFireFn,
});


// ──────── 01-theme.jsx ────────
// Dealigence theme tokens — derived from style-pack.md (real logo SVG + existing teaser frames).
window.THEME = {
  bg: {
    A: '#E7DECD',   // narrative / bookend scenes
    B: '#F7F1EA',   // in-product UI scenes
    card: '#FFFFFF',
    cardMuted: '#EDE6D8',
  },
  ink: {
    primary: '#3A2F22',      // warm charcoal headline
    secondary: '#8A7F6C',    // muted warm gray subhead/caption
    onDark: '#FFFFFF',
  },
  brand: {
    navy: '#004B87',
    sky: '#0091D2',
    pale: '#BEE1F5',
  },
  accent: {
    indigo: '#4A56C9',
    indigoSoft: '#DEE1F7',
  },
  font: {
    serif: 'Georgia, "Times New Roman", serif',
    sans: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
    mono: 'ui-monospace, "SF Mono", Menlo, Consolas, monospace',
  },
  shadow: {
    card: '0 12px 32px rgba(58,47,34,0.10)',
    cardLift: '0 18px 48px rgba(58,47,34,0.16)',
  },
};


// ──────── 02-components.jsx ────────
// Dealigence faux-UI + brand components. IIFE-wrapped so top-level consts
// (T, destructured window primitives) don't collide with other concatenated files.
(function () {
  const { Layer, Easing, interpolate, seq, hold, envS, twLerp, clamp01 } = window;
  const T = window.THEME;

  // ── Deterministic "human" typing (scrub-safe, no Math.random) ─────────────
  function pseudo(i) { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); }
  function charDur(c, i, msPerChar, jitterMs) {
    const jitter = (pseudo(i) - 0.5) * 2 * jitterMs;
    let dur = msPerChar + jitter;
    if (c === ' ') dur += 90;
    if (/[,.!?;:]/.test(c)) dur += 220;
    return Math.max(40, dur);
  }
  function typedText(text, start, t, msPerChar = 210, jitterMs = 35) {
    const ltMs = (t - start) * 1000;
    if (ltMs <= 0) return '';
    let acc = 0, n = 0;
    for (let i = 0; i < text.length; i++) {
      acc += charDur(text[i], i, msPerChar, jitterMs);
      if (acc > ltMs) break;
      n = i + 1;
    }
    return text.slice(0, n);
  }
  function typingDurationS(text, msPerChar = 210, jitterMs = 35) {
    let acc = 0;
    for (let i = 0; i < text.length; i++) acc += charDur(text[i], i, msPerChar, jitterMs);
    return acc / 1000;
  }
  function TypedText({ text, start, t, msPerChar = 210, jitterMs = 35, style, holdCaret = 1.2 }) {
    const shown = typedText(text, start, t, msPerChar, jitterMs);
    const done = shown.length >= text.length;
    const totalDur = typingDurationS(text, msPerChar, jitterMs);
    const showCaret = t >= start && t < start + totalDur + holdCaret;
    return (
      <span style={style}>
        {shown}
        {showCaret && <span className="caret" style={{ background: style?.color || 'currentColor' }} />}
      </span>
    );
  }

  // ── Typography ──────────────────────────────────────────────────────────
  function EyebrowLabel({ children, color = T.accent.indigo, style }) {
    return (
      <div style={{
        fontFamily: T.font.sans, fontSize: 12, fontWeight: 700, letterSpacing: 1.6,
        textTransform: 'uppercase', color, ...style,
      }}>{children}</div>
    );
  }
  function Headline({ children, size = 42, style }) {
    return (
      <div style={{
        fontFamily: T.font.serif, fontSize: size, fontWeight: 400,
        color: T.ink.primary, letterSpacing: -0.5, lineHeight: 1.12, ...style,
      }}>{children}</div>
    );
  }
  function Subhead({ children, style }) {
    return (
      <div style={{
        fontFamily: T.font.sans, fontSize: 17, color: T.ink.secondary,
        lineHeight: 1.5, ...style,
      }}>{children}</div>
    );
  }

  // ── Brand mark (real geometry: two rounded squares + circle, from the
  //    actual dealigence_logo_shareable_home.svg icon group) ────────────────
  function IconMark({ size = 64, drawProgress = 1, style }) {
    // native icon bbox ~ x:60-330 y:90-380 in source units; normalize to a 300x300 box.
    const p = clamp01(drawProgress);
    const sq1 = clamp01(p / 0.55);
    const sq2 = clamp01((p - 0.25) / 0.55);
    const circ = clamp01((p - 0.55) / 0.45);
    return (
      <svg width={size} height={size} viewBox="40 100 320 300" style={style}>
        <rect x="60" y="120" width="160" height="160" rx="25" ry="25" fill={T.brand.navy}
              opacity={sq1} transform={`scale(${0.85 + 0.15 * sq1})`} transformOrigin="140px 200px" />
        <rect x="170" y="220" width="160" height="160" rx="25" ry="25" fill={T.brand.sky}
              opacity={sq2} transform={`scale(${0.85 + 0.15 * sq2})`} transformOrigin="250px 300px" />
        <circle cx="310" cy="140" r="50" fill={T.brand.pale} opacity={circ} />
      </svg>
    );
  }
  function Wordmark({ size = 40, color = T.brand.navy, style }) {
    return (
      <div style={{
        fontFamily: T.font.sans, fontWeight: 800, fontSize: size, color,
        letterSpacing: -0.5, ...style,
      }}>Dealigence</div>
    );
  }
  function LogoLockup({ scale = 1, iconSize = 44, wordSize = 34, opacity = 1, style }) {
    return (
      <Layer opacity={opacity} style={{ display: 'flex', alignItems: 'center', gap: 10, transform: `scale(${scale})`, transformOrigin: 'left center', ...style }}>
        <IconMark size={iconSize} />
        <Wordmark size={wordSize} />
      </Layer>
    );
  }
  function CornerLogo({ opacity = 1 }) {
    return (
      <Layer x={1280 - 190} y={720 - 44} w={170} h={28} opacity={opacity}
             style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <IconMark size={22} />
        <div style={{ fontFamily: T.font.sans, fontWeight: 800, fontSize: 16, color: T.brand.navy }}>Dealigence</div>
      </Layer>
    );
  }

  // ── Cards / panels ─────────────────────────────────────────────────────
  function Panel({ x, y, w, h, opacity = 1, muted = false, style, children }) {
    return (
      <Layer x={x} y={y} w={w} h={h} opacity={opacity}>
        <div style={{
          width: '100%', height: '100%', background: muted ? T.bg.cardMuted : T.bg.card,
          borderRadius: 18, boxShadow: muted ? 'none' : T.shadow.card,
          border: muted ? `1px solid ${T.bg.cardMuted}` : 'none',
          boxSizing: 'border-box', position: 'relative', ...style,
        }}>{children}</div>
      </Layer>
    );
  }
  // Flow component (NOT Layer/absolute) — safe to stack inside a flex column.
  function OptionPill({ w = 240, h = 44, label, selected, opacity = 1 }) {
    return (
      <div style={{
        width: w, height: h, opacity, borderRadius: 10, display: 'flex', alignItems: 'center',
        paddingLeft: 16, boxSizing: 'border-box', fontFamily: T.font.sans, fontSize: 14, fontWeight: 700,
        background: selected ? T.accent.indigo : '#EFEBE2',
        color: selected ? '#fff' : T.ink.primary,
        flexShrink: 0,
      }}>{label}</div>
    );
  }

  // ── Cursor ──────────────────────────────────────────────────────────────
  function Cursor({ x, y, opacity = 1, clicking = false }) {
    return (
      <Layer x={x} y={y} w={28} h={28} opacity={opacity} style={{ zIndex: 500 }}>
        <svg width="28" height="28" viewBox="0 0 28 28" style={{ filter: 'drop-shadow(0 2px 3px rgba(0,0,0,0.35))' }}>
          <path d="M4 2 L4 22 L9.5 17.5 L13 25 L16.5 23.5 L13 16 L20 16 Z"
                fill="#fff" stroke="#2b2b2b" strokeWidth="1.4" strokeLinejoin="round" />
        </svg>
        {clicking && (
          <div style={{
            position: 'absolute', left: -10, top: -10, width: 40, height: 40, borderRadius: 999,
            border: `2px solid ${T.accent.indigo}`, opacity: 0.9,
          }} />
        )}
      </Layer>
    );
  }
  // click-ring pulse: returns {scale, opacity} for a 0-1 local progress
  function clickRing(p) {
    return { scale: interpolate(p, [0, 1], [0.4, 1.6], Easing.outCubic), opacity: interpolate(p, [0, 1], [0.9, 0]) };
  }

  // ── Chat ────────────────────────────────────────────────────────────────
  function ChatBubble({ x, y, w, align = 'right', mine = false, opacity = 1, children }) {
    return (
      <Layer x={x} y={y} w={w} opacity={opacity} style={{ display: 'flex', justifyContent: align === 'right' ? 'flex-end' : 'flex-start' }}>
        <div style={{
          maxWidth: '92%', padding: '12px 16px', borderRadius: 16,
          borderBottomRightRadius: mine ? 4 : 16, borderBottomLeftRadius: mine ? 16 : 4,
          background: mine ? T.accent.indigo : T.bg.card,
          color: mine ? '#fff' : T.ink.primary,
          fontFamily: T.font.sans, fontSize: 14.5, lineHeight: 1.45,
          boxShadow: mine ? 'none' : T.shadow.card,
        }}>{children}</div>
      </Layer>
    );
  }

  // ── Score ring ──────────────────────────────────────────────────────────
  // Flow component (NOT Layer/absolute) — safe to stack inside a flex row/column.
  function ScoreRing({ size = 96, stroke = 8, progress, value, label, color = T.brand.navy, opacity = 1 }) {
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const dash = c * clamp01(progress);
    const shown = Math.round(value * clamp01(progress));
    return (
      <div style={{ width: size, opacity, flexShrink: 0, position: 'relative' }}>
        <svg width={size} height={size} style={{ transform: 'rotate(-90deg)', display: 'block' }}>
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="#EAE3D4" strokeWidth={stroke} />
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke}
                  strokeDasharray={`${dash} ${c}`} strokeLinecap="round" />
        </svg>
        <div style={{
          position: 'absolute', left: 0, top: 0, width: size, height: size, display: 'flex',
          alignItems: 'center', justifyContent: 'center', fontFamily: T.font.sans,
          fontWeight: 800, fontSize: size * 0.3, color: T.ink.primary,

// ──────── 03-audio.jsx ────────
// Procedural Web Audio SFX — no asset files. Silent until first user gesture
// (browser autoplay policy); fine since Stage starts on load, sound catches up.
(function () {
  let ctx = null;
  function getCtx() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone(freq, dur, { type = 'sine', gain = 0.06, attack = 0.005, decay = dur } = {}) {
    try {
      const c = getCtx();
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0, c.currentTime);
      g.gain.linearRampToValueAtTime(gain, c.currentTime + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + decay);
      osc.connect(g).connect(c.destination);
      osc.start();
      osc.stop(c.currentTime + decay + 0.05);
    } catch (_) {}
  }

  function click() { tone(720, 0.05, { type: 'sine', gain: 0.045, decay: 0.06 }); }
  function tick() { tone(1000, 0.035, { type: 'sine', gain: 0.03, decay: 0.04 }); }
  function whoosh() {
    try {
      const c = getCtx();
      const bufSize = c.sampleRate * 0.35;
      const buf = c.createBuffer(1, bufSize, c.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
      const src = c.createBufferSource();
      src.buffer = buf;
      const filt = c.createBiquadFilter();
      filt.type = 'bandpass';
      filt.frequency.value = 900;
      const g = c.createGain();
      g.gain.value = 0.04;
      src.connect(filt).connect(g).connect(c.destination);
      src.start();
    } catch (_) {}
  }
  function chime(freq = 660) {
    tone(freq, 0.9, { type: 'sine', gain: 0.05, decay: 0.9 });
    tone(freq * 1.5, 0.9, { type: 'sine', gain: 0.025, decay: 0.85 });
  }

  function makeFireFn() {
    const fired = new Set();
    let lastT = 0;
    return function fire(threshold, key, fn) {
      const now = arguments.length >= 4 ? arguments[3]() : lastT;
      if (now < lastT - 0.05 && fired.has(key)) fired.delete(key);
      if (lastT <= threshold && now > threshold && !fired.has(key)) {
        fired.add(key);
        try { fn(); } catch (_) {}
      }
      lastT = now;
    };
  }

  window.AUDIO = { click, tick, whoosh, chime };
  window.makeSfxFireFn = makeFireFn;
})();

//    present, independent of scene. Subtle "premium" texture, not decoration. ──
function AmbientBlobs({ t }) {
  const bx1 = 180 + Math.sin(t * 0.05) * 60;
  const by1 = 140 + Math.cos(t * 0.04) * 40;
  const bx2 = 1040 + Math.sin(t * 0.045 + 2) * 70;
  const by2 = 560 + Math.cos(t * 0.05 + 1) * 50;
  return (
    <div style={{ position: 'absolute', inset: 0, zIndex: 0, overflow: 'hidden', pointerEvents: 'none' }}>
      <div style={{
        position: 'absolute', left: bx1 - 260, top: by1 - 260, width: 520, height: 520,
        borderRadius: '50%', background: T.brand.pale, opacity: 0.16, filter: 'blur(90px)',
      }} />
      <div style={{
        position: 'absolute', left: bx2 - 220, top: by2 - 220, width: 440, height: 440,
        borderRadius: '50%', background: T.accent.indigoSoft, opacity: 0.14, filter: 'blur(90px)',
      }} />
    </div>
  );
}

function Background({ t }) {
  const idx = findSceneIndex(t);
  const bottomColor = T.bg[SCENE_BG[Math.max(0, idx - 1)]];
  const topColor = T.bg[SCENE_BG[idx]];
  const fadeP = idx === 0 ? 1 : interpolate(
    t, [starts[idx] - FADE / 2, starts[idx] + FADE / 2], [0, 1], Easing.smooth
  );
  // gentle scale-settle on the incoming background — 1.012 -> 1.0 as it fades in
  const topScale = idx === 0 ? 1 : interpolate(fadeP, [0, 1], [1.012, 1]);
  return (
    <>
      <div style={{ position: 'absolute', inset: 0, background: bottomColor, zIndex: 0 }} />
      <div style={{
        position: 'absolute', inset: 0, background: topColor, opacity: fadeP, zIndex: 0,
        transform: `scale(${topScale})`, transformOrigin: 'center',
      }} />
      <AmbientBlobs t={t} />
    </>
  );
}

function SceneRender({ s, start, dur }) {
  const t = window.useTime();
  if (t < start - PAD || t > start + dur + PAD) return null;
  return s(t, start, dur);
}

function SfxDriver() {
  const t = window.useTime();
  const fireRef = React.useRef(window.makeFireFn(() => t));
  React.useEffect(() => {
    for (const ev of EVENTS) fireRef.current(ev.t, `${ev.t}`, ev.fn);
  }, [t]);
  return null;
}

function App() {
  return (
    <Stage duration={total} width={1280} height={720}>
      <BgLayer />
      {SCENES.map((s, i) => (
        <Layer key={i} x={0} y={0} w={1280} h={720} style={{ position: 'absolute', inset: 0 }}>
          <SceneRender s={s} start={starts[i]} dur={durs[i]} />
        </Layer>
      ))}
      <SfxDriver />
    </Stage>
  );
}

function BgLayer() {
  const t = window.useTime();
  return <Background t={t} />;
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);

</script>

</body>
</html>
